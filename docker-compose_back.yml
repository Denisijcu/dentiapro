version: "3.9"

services:
  # --------------------------------------------------------
  # PostgreSQL
  # --------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: dentiapro_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dentiapro_user
      POSTGRES_PASSWORD: dentiapro_pass
      POSTGRES_DB: dentiapro_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dentiapro_user -d dentiapro_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --------------------------------------------------------
  # Redis
  # --------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: dentiapro_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --------------------------------------------------------
  # Backend API
  # --------------------------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dentiapro_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://dentiapro_user:dentiapro_pass@db:5432/dentiapro_db
      DATABASE_URL_SYNC: postgresql://dentiapro_user:dentiapro_pass@db:5432/dentiapro_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      PYTHONPATH: /app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # --------------------------------------------------------
  # Celery Worker
  # --------------------------------------------------------
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dentiapro_celery
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://dentiapro_user:dentiapro_pass@db:5432/dentiapro_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      PYTHONPATH: /app
    depends_on:
      - redis
      - db
    volumes:
      - ./backend:/app
    command: celery -A app.services.celery_app worker --loglevel=info

  # --------------------------------------------------------
  # Flower (Celery monitor)
  # --------------------------------------------------------
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dentiapro_flower
    restart: unless-stopped
    ports:
      - "5555:5555"
    environment:
      CELERY_BROKER_URL: redis://redis:6379/1
      PYTHONPATH: /app
    depends_on:
      - redis
    volumes:
      - ./backend:/app
    command: celery -A app.services.celery_app flower --port=5555

volumes:
  postgres_data: